# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
spring.application.name=event-registration-site
server.port=${PORT:8080}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File upload (event posters)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# SUPABASE / POSTGRESQL DATA STORAGE
# ---------------------------------------------------------------------------
# Set these environment variables or replace with your Supabase credentials:
# In Supabase: Settings -> Database -> Connection string -> JDBC / URI
# Example: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.xgrgrzcxmwjzfpucrauo.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Lathajeni06}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Session (demo authentication only - see AuthService)
server.servlet.session.timeout=60m
