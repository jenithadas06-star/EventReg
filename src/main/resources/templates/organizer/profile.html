<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Organizer profile')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="page">
    <div class="container">

        <div class="section-head">
            <div>
                <p class="eyebrow">Account</p>
                <h2>Organizer profile</h2>
                <p>Your name and club appear on every event you publish.</p>
            </div>
        </div>

        <div class="detail-grid">

            <section class="card">
                <div class="card-header">
                    <h3>Edit details</h3>
                    <span class="badge badge-gold">Organizer</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/organizer/profile}" method="post" novalidate>
                        <div class="form-grid mb-3">
                            <div class="field span-2">
                                <label for="fullName">Full name <span class="required">*</span></label>
                                <input class="input" type="text" id="fullName" name="fullName" required
                                       th:value="${currentOrganizer.fullName}"/>
                            </div>
                            <div class="field span-2">
                                <label for="email">Email address <span class="required">*</span></label>
                                <input class="input" type="email" id="email" name="email" required
                                       th:value="${currentOrganizer.email}"/>
                            </div>
                            <div class="field span-2">
                                <label for="clubOrDepartment">Club or department</label>
                                <input class="input" type="text" id="clubOrDepartment" name="clubOrDepartment"
                                       th:value="${currentOrganizer.clubOrDepartment}"/>
                            </div>
                            <div class="field">
                                <label for="designation">Designation</label>
                                <input class="input" type="text" id="designation" name="designation"
                                       th:value="${currentOrganizer.designation}"/>
                            </div>
                            <div class="field">
                                <label for="contactNumber">Contact number</label>
                                <input class="input" type="tel" id="contactNumber" name="contactNumber"
                                       th:value="${currentOrganizer.contactNumber}"/>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="btn btn-primary" type="submit">Save changes</button>
                            <a class="btn btn-ghost" th:href="@{/organizer/dashboard}">Back to dashboard</a>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="sticky-side">
                <article class="card">
                    <div class="card-body">
                        <div class="flex gap-2 mb-2">
                            <span class="avatar" th:text="${currentOrganizer.initials}">PN</span>
                            <div>
                                <div class="nav-user__name" style="color:var(--navy-800)"
                                     th:text="${currentOrganizer.fullName}">Name</div>
                                <div class="text-muted" style="font-size:.8rem"
                                     th:text="${currentOrganizer.email}">email</div>
                            </div>
                        </div>
                        <ul class="info-list">
                            <li><span class="info-key">Club / Dept.</span><span class="info-value" th:text="${currentOrganizer.clubOrDepartment}">-</span></li>
                            <li><span class="info-key">Designation</span><span class="info-value" th:text="${currentOrganizer.designation}">-</span></li>
                            <li><span class="info-key">Contact</span><span class="info-value" th:text="${currentOrganizer.contactNumber}">-</span></li>
                            <li><span class="info-key">Events hosted</span><span class="info-value" th:text="${eventCount}">0</span></li>
                        </ul>
                        <a class="btn btn-navy btn-block mt-2" th:href="@{/organizer/events}">Manage my events</a>
                    </div>
                </article>
            </aside>

        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
