# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
spring.application.name=event-registration-site
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File upload (event posters)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# DATA STORAGE
# ---------------------------------------------------------------------------
# No database is required for this stage. All data lives in memory
# (see com.college.events.repository.InMemory*Repository) and is re-seeded
# from com.college.events.config.DataSeeder on every start-up.
#
# To move to MySQL later:
#   1. add spring-boot-starter-data-jpa + mysql-connector-j to pom.xml
#   2. add the datasource properties below
#   3. replace the InMemory*Repository classes with Spring Data JPA interfaces
#      (they already implement the repository contracts used by the services)
#
# spring.datasource.url=jdbc:mysql://localhost:3306/event_registration
# spring.datasource.username=root
# spring.datasource.password=change-me
# spring.jpa.hibernate.ddl-auto=update
# ---------------------------------------------------------------------------

# Session (demo authentication only - see AuthService)
server.servlet.session.timeout=60m
