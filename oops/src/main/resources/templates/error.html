<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="page">
    <div class="container">
        <div class="empty-state">
            <div class="empty-state__icon">&#9888;</div>
            <h3 th:text="${status != null} ? 'Error ' + ${status} + ' - ' + ${error} : 'Something went wrong'">
                Something went wrong
            </h3>
            <p th:text="${message != null and !message.isEmpty()} ? ${message}
                        : 'We could not complete that request. Please try again.'">
                We could not complete that request.
            </p>
            <div class="btn-row" style="justify-content:center">
                <a class="btn btn-primary mt-2" th:href="@{/}">Back to the homepage</a>
                <a class="btn btn-ghost mt-2" th:href="@{/explore}">Explore events</a>
            </div>
            <p class="text-muted mt-3" style="font-size:.82rem"
               th:text="${path != null} ? 'Requested path: ' + ${path} : ''"></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
